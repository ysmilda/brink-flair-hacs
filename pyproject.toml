[project]
name = "brink-flair-hacs"
version = "0.1.2"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
[tool.ruff.lint.isort]
combine-as-imports = true
# Mirrors Home Assistant core so integration files can be shared verbatim.
force-sort-within-sections = true
known-first-party = ["homeassistant", "testing"]